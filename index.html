<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>IntervalTimer</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system;padding:env(safe-area-inset-top) 18px 30px}main{max-width:520px;margin:auto}h1{font-size:25px}.tabs,.actions{display:flex;gap:10px}.tabs button{flex:1}.tabs{background:#171717;padding:4px;border-radius:12px}button{border:0;border-radius:12px;padding:13px;color:#fff;background:#303030;font-weight:700}.green{background:#20d65a;color:#001b09}.card{background:#151515;padding:15px;border-radius:16px;margin:12px 0}.card small{color:#aaa}.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}.view{display:none}.active{display:block}.center{text-align:center}.ring{--p:1;--c:#20d65a;width:min(72vw,310px);aspect-ratio:1;border-radius:50%;margin:25px auto;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1turn),#222 0);position:relative}.ring:before{content:'';position:absolute;inset:17px;border-radius:50%;background:#000}.time{position:relative;font-size:66px;font-weight:800}.phase{font-weight:800;letter-spacing:1px}.muted{color:#999}.status{font-size:13px;margin:12px}.on{color:#20d65a}.off{color:#ff9f0a}dialog{background:#111;color:#fff;border:1px solid #333;border-radius:18px;width:min(92vw,480px)}label{display:block;margin:10px 0;color:#bbb}input{display:block;width:100%;padding:11px;background:#222;color:#fff;border:1px solid #444;border-radius:9px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main><h1>IntervalTimer</h1><section id="home" class="view active"><div class="tabs"><button id="tInt" class="green">Intervalli</button><button id="tSw">Cronometro</button></div><div id="int"><p><button id="new" class="green">＋ Nuovo allenamento</button></p><div id="list"></div></div><div id="sw" hidden class="center"><h2>CRONOMETRO</h2><div id="swt" class="time">00:00.00</div><div class="actions"><button id="swgo" class="green">Avvia</button><button id="swr">Reset</button></div></div></section><section id="timer" class="view center"><button id="back">‹ Allenamenti</button><h2 id="title"></h2><div id="phase" class="phase">PRONTO</div><div id="ring" class="ring"><div id="clock" class="time">00:20</div></div><div id="count" class="muted"></div><div id="wake" class="status">Schermo attivo: da avviare</div><div class="actions"><button id="go" class="green">Avvia</button><button id="reset">Reset</button></div></section></main><dialog id="dlg"><form id="form"><h2>Allenamento</h2><input id="id" type="hidden"><label>Nome<input id="name" required></label><div class="grid"><label>Preparazione iniziale sec<input id="prep" type="number" min="0" value="10"></label><label>Esercizio sec<input id="work" type="number" min="1" value="30"></label><label>Riposo sec<input id="rest" type="number" min="0" value="15"></label><label>Round<input id="rounds" type="number" min="1" value="8"></label><label>Serie<input id="series" type="number" min="1" value="1"></label><label>Pausa serie sec<input id="brk" type="number" min="0" value="60"></label></div><div class="actions"><button type="button" id="cancel">Annulla</button><button class="green">Salva</button></div></form></dialog><script src="app.js"></script></body></html>
