<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>IntervalTimer</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}body{min-height:100dvh}button,input,select{font:inherit}button{border:0;border-radius:13px;padding:13px;color:#fff;background:#303030;font-weight:750}.green{background:#20d65a;color:#001b09}main{min-height:100dvh}.home{max-width:540px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 18px 30px}.tabs,.actions,.row{display:flex;gap:9px}.tabs button,.row button,.actions button{flex:1}.tabs{background:#161616;padding:4px;border-radius:14px}.card{background:#151515;padding:16px;border:1px solid #292929;border-radius:17px;margin:12px 0}.card small{color:#aaa;line-height:1.5}.view{display:none}.view.active{display:block}#timer{min-height:100dvh}.current{height:50dvh;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;transition:background .25s}.prepare{background:#f5a623}.exercise{background:#18a94b}.rest{background:#d52b22}.break{background:#0878d1}.finished{background:#151515}.phase{font-size:clamp(18px,5vw,26px);font-weight:900;letter-spacing:1.5px}.bigTime{font-size:clamp(96px,28vw,158px);line-height:.95;font-weight:900;letter-spacing:-6px;font-variant-numeric:tabular-nums;text-shadow:0 3px 18px #0004}.workoutName{font-size:20px;font-weight:700;margin-bottom:10px}.lower{height:50dvh;min-height:330px;background:#080808;padding:20px 20px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;justify-content:space-between}.nextBox{background:#171717;border:1px solid #2b2b2b;border-radius:18px;padding:18px;text-align:center}.nextLabel{color:#999;font-size:13px;font-weight:800;letter-spacing:1px}.nextPhase{font-size:24px;font-weight:900;margin-top:6px}.nextBox.next-exercise{background:#146c34;border-color:#20d65a}.nextBox.next-rest{background:#7b1d19;border-color:#ff5148}.nextBox.next-break{background:#075693;border-color:#168fff}.nextBox.next-prepare{background:#87580d;border-color:#f5a623}.nextBox.next-finished{background:#252525;border-color:#555}.nextTime{font-size:46px;font-weight:850;font-variant-numeric:tabular-nums}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#151515;border-radius:16px;padding:14px;text-align:center}.stat strong{display:block;font-size:32px}.stat span,.status{color:#999;font-size:13px}.status{text-align:center}.back{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;background:#0004;z-index:2}.center{text-align:center;padding-top:10vh}.swtime{font-size:56px;font-weight:800;margin:30px 0}dialog{background:#111;color:#fff;border:1px solid #333;border-radius:18px;width:min(92vw,500px)}label{display:block;color:#bbb;margin:10px 0}input,select{display:block;width:100%;padding:12px;margin-top:5px;background:#222;color:#fff;border:1px solid #444;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto;margin:0}@media(max-height:700px){.current,.lower{min-height:300px}.bigTime{font-size:90px}.nextTime{font-size:36px}}
</style></head><body><main><section id="home" class="view active home"><h1>IntervalTimer</h1><div class="tabs"><button id="tabI" class="green">Intervalli</button><button id="tabS">Cronometro</button></div><div id="intervals"><p><button id="new" class="green">＋ Nuovo allenamento</button></p><div id="list"></div></div><div id="stopwatch" hidden class="center"><h2>CRONOMETRO</h2><div id="swtime" class="swtime">00:00.00</div><div class="actions"><button id="swgo" class="green">Avvia</button><button id="swreset">Reset</button></div></div></section><section id="timer" class="view"><button id="back" class="back">‹ Esci</button><div id="current" class="current prepare"><div id="title" class="workoutName"></div><div id="phase" class="phase">PREPARATI</div><div id="clock" class="bigTime">00:10</div></div><div class="lower"><div id="nextBox" class="nextBox"><div class="nextLabel">FASE SUCCESSIVA</div><div id="nextPhase" class="nextPhase">ALLENAMENTO</div><div id="nextTime" class="nextTime">00:20</div></div><div class="stats"><div class="stat"><strong id="roundsLeft">8</strong><span>round mancanti</span></div><div class="stat"><strong id="seriesLeft">1</strong><span>serie mancanti</span></div></div><div id="wake" class="status">Schermo attivo: da avviare</div><div class="actions"><button id="go" class="green">Avvia</button><button id="reset">Reset</button></div></div></section></main><dialog id="dlg"><form id="form"><h2>Allenamento</h2><input id="id" type="hidden"><label>Nome<input id="name" required></label><div class="grid"><label>Preparazione iniziale<input id="prep" type="number" min="0" value="10"></label><label>Allenamento<input id="work" type="number" min="1" value="30"></label><label>Riposo round<input id="rest" type="number" min="0" value="15"></label><label>Round per serie<input id="rounds" type="number" min="1" value="8"></label><label>Numero serie<input id="series" type="number" min="1" value="1"></label><label>Riposo tra serie<input id="brk" type="number" min="0" value="60"></label><label>Suono<select id="sound"><option value="gym">Gym Buzzer</option><option value="electronic">Electronic Beep</option><option value="horn">Air Horn</option><option value="military">Military Timer</option><option value="industrial">Industrial Alarm</option></select><button type="button" id="previewSound" style="margin-top:8px;width:100%">▶ Ascolta</button></label><label class="check"><input id="voice" type="checkbox"> Annunci vocali</label></div><small>Gli annunci vocali sono disattivati per non interrompere la musica su iPhone.</small><div class="actions"><button type="button" id="cancel">Annulla</button><button class="green">Salva</button></div></form></dialog><script src="app.js"></script></body></html>
